<title>K8 map berkas, absen masuk</title>

<style>
body{margin:0;background:#FBF6EE;font-family:"Public Sans",ui-sans-serif,system-ui,sans-serif;color:#163A2E}
a{color:#255F4A}a:hover{color:#163A2E}
@keyframes k8-stack{from{opacity:0;transform:translateY(70px)}to{opacity:1;transform:none}}
@keyframes k8-tab{from{opacity:0;transform:translateY(20px)}to{opacity:1;transform:none}}
@keyframes k8-paper{from{transform:translateY(150px)}to{transform:none}}
@keyframes k8-rise{from{opacity:0;transform:translateY(16px)}to{opacity:1;transform:none}}

@keyframes k8-pulse{0%{box-shadow:0 0 0 0 rgba(188,132,32,0.5)}70%,100%{box-shadow:0 0 0 10px rgba(188,132,32,0)}}
@keyframes k8-up{from{transform:translateY(100%)}to{transform:none}}
@keyframes k8-draw{from{stroke-dashoffset:24}to{stroke-dashoffset:0}}
@media (prefers-reduced-motion: reduce){*,*::before,*::after{animation:none!important;transition:none!important}}
</style>
<style>body{display:flex;justify-content:center}#dc-root{flex-shrink:0}</style>

<a href="L-K8-Tercatat.html" style="display: flex; align-items: center; justify-content: center; gap: 8px; height: 56px; border-radius: 14px; background: #FBF6EE; color: #163A2E; text-decoration: none; font-size: 17px; font-weight: 700; animation: k8-rise 0.35s ease-out 1.1s both"><svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.75" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M4 8h3l2-3h6l2 3h3v11H4z"></path><circle cx="12" cy="13" r="3.5"></circle></svg>Ambil foto dan simpan</a>
