<!doctype html>
<html lang="id">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>K5 rak loker, absen tercatat</title>
<link href="https://fonts.googleapis.com/css2?family=Gantari:wght@500;600;700;800&amp;family=Public+Sans:wght@400;500;600;700&amp;display=swap" rel="stylesheet">
<style>
body{margin:0;background:#163A2E;font-family:"Public Sans",ui-sans-serif,system-ui,sans-serif;color:#163A2E}
a{color:#255F4A}a:hover{color:#163A2E}
@keyframes k5-door{from{transform:translateX(0)}to{transform:translateX(101%)}}
@keyframes k5-rise{from{opacity:0;transform:translateY(16px)}to{opacity:1;transform:none}}
@keyframes k5-pop{0%{transform:scale(0.4)}70%{transform:scale(1.1)}100%{transform:scale(1)}}
@keyframes k5-scan{from{transform:translateY(0)}to{transform:translateY(196px)}}
@keyframes k5-up{from{transform:translateY(100%)}to{transform:none}}
@keyframes k5-open{from{width:100%}to{width:72px}}
@media (prefers-reduced-motion: reduce){*,*::before,*::after{animation:none!important;transition:none!important}}
</style>
<style>body{display:flex;justify-content:center}#dc-root{flex-shrink:0}</style>
</head>
<body>
<div id="dc-root">
<div style="width: 390px; height: 844px; box-sizing: border-box; display: flex; flex-direction: column; overflow: hidden; background: #163A2E; color: #FBF6EE; font-family: 'Public Sans', ui-sans-serif, system-ui, sans-serif">

<header style="display: flex; align-items: center; gap: 4px; padding: 12px 16px 16px 8px">
<a href="L-K5-Beranda.html" aria-label="Kembali ke rak" style="width: 44px; height: 44px; display: flex; align-items: center; justify-content: center; color: #FBF6EE"><svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.75" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M15 6l-6 6 6 6"></path></svg></a>
<h1 style="margin: 0; font-family: 'Gantari', 'Public Sans', sans-serif; font-size: 20px; font-weight: 700; line-height: 1.25">Absen masuk</h1>
</header>

<div style="padding: 0 10px; display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 8px">

<section style="grid-column: span 2; height: 360px; background: #F4EBDC; color: #163A2E; display: flex; overflow: hidden">
<div style="flex-grow: 1; padding: 24px 22px; display: flex; flex-direction: column; gap: 12px">
<span style="width: 64px; height: 64px; border-radius: 999px; background: #255F4A; color: #FFFFFF; display: flex; align-items: center; justify-content: center; animation: k5-pop 0.5s ease-out 0.95s both"><svg width="34" height="34" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.25" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M5 12.5l4.5 4.5L19 7.5"></path></svg></span>
<span style="font-family: 'Gantari', 'Public Sans', sans-serif; font-size: 30px; font-weight: 800; line-height: 1.05; margin-top: 8px; animation: k5-rise 0.4s ease-out 1.05s both">Tercatat</span>
<span style="font-size: 64px; font-weight: 700; line-height: 1; letter-spacing: -0.03em; animation: k5-rise 0.4s ease-out 1.12s both">06.52</span>
<span style="font-size: 15px; line-height: 1.45; color: #6B6154; margin-top: auto">Senin, 28 Sep<br>Gedung Kantor Diponegoro</span>
</div>
<div aria-hidden="true" style="width: 72px; flex-shrink: 0; background: #255F4A; box-shadow: -8px 0 0 #163A2E; display: flex; align-items: center; justify-content: center; animation: k5-open 0.8s cubic-bezier(.6,0,.2,1) 0.35s both">
<span style="width: 6px; height: 40px; border-radius: 999px; background: rgba(251,246,238,0.7)"></span>
</div>
</section>

<div style="min-height: 116px; box-sizing: border-box; background: #FFFFFF; color: #163A2E; padding: 14px 16px; display: flex; flex-direction: column; gap: 6px; position: relative; overflow: hidden">
<span aria-hidden="true" style="position: absolute; inset: 0; z-index: 2; background: #255F4A; display: flex; align-items: center; padding-left: 14px; transform: translateX(101%); animation: k5-door 0.6s cubic-bezier(.6,0,.2,1) 1.20s both"><span style="width: 6px; height: 36px; border-radius: 999px; background: rgba(251,246,238,0.7)"></span></span>
<span style="display: inline-flex; align-items: center; gap: 4px; font-size: 13px; font-weight: 700; line-height: 1.3; color: #6B6154"><svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="#BC8420" stroke-width="2.25" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M4 20v-3M9 20v-6M14 20v-9M19 20V5"></path><path d="M3 4l18 16"></path></svg>Status kirim</span>
<span style="margin-top: auto; font-family: 'Gantari', 'Public Sans', sans-serif; font-size: 18px; font-weight: 700; line-height: 1.2">Aman di HP</span>
<span style="font-size: 13px; line-height: 1.35; color: #6B6154">Dikirim saat ada sinyal</span>
</div>
<div style="min-height: 116px; box-sizing: border-box; background: #FFFFFF; color: #163A2E; padding: 14px 16px; display: flex; flex-direction: column; gap: 6px; position: relative; overflow: hidden">
<span aria-hidden="true" style="position: absolute; inset: 0; z-index: 2; background: #255F4A; display: flex; align-items: center; padding-left: 14px; transform: translateX(101%); animation: k5-door 0.6s cubic-bezier(.6,0,.2,1) 1.28s both"><span style="width: 6px; height: 36px; border-radius: 999px; background: rgba(251,246,238,0.7)"></span></span>
<span style="font-size: 13px; font-weight: 700; line-height: 1.3; color: #6B6154">Lokasi</span>
<span style="margin-top: auto; font-family: 'Gantari', 'Public Sans', sans-serif; font-size: 18px; font-weight: 700; line-height: 1.2">38 m dari titik</span>
<span style="font-size: 13px; line-height: 1.35; color: #6B6154">Di dalam radius 100 m</span>
</div>
<div style="grid-column: span 2; box-sizing: border-box; background: #F4EBDC; color: #163A2E; padding: 12px 16px; display: flex; align-items: center; gap: 12px; position: relative; overflow: hidden">
<span aria-hidden="true" style="position: absolute; inset: 0; z-index: 2; background: #255F4A; display: flex; align-items: center; padding-left: 14px; transform: translateX(101%); animation: k5-door 0.6s cubic-bezier(.6,0,.2,1) 1.36s both"><span style="width: 6px; height: 36px; border-radius: 999px; background: rgba(251,246,238,0.7)"></span></span>
<span style="font-size: 13px; font-weight: 700; line-height: 1.3; color: #6B6154">Kode absen</span>
<span style="margin-left: auto; font-size: 16px; font-weight: 700; line-height: 1.3; font-variant-numeric: tabular-nums">AB-7F3C-91D2</span>
</div>
</div>

<p style="margin: 16px 24px 0; font-size: 14px; line-height: 1.5; color: #F4EBDC; animation: k5-rise 0.4s ease-out 1.5s both">Jam resmi dicatat server begitu absen terkirim. Kamu tidak perlu absen ulang.</p>

<div style="margin-top: auto; padding: 16px 16px 24px">
<a href="L-K5-Beranda.html" style="display: flex; align-items: center; justify-content: center; height: 56px; background: #FBF6EE; color: #163A2E; text-decoration: none; font-size: 17px; font-weight: 700; border-radius: 999px">Kembali ke rak</a>
</div>
</div>
</div>

</html>
