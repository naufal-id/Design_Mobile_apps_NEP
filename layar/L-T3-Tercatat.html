<!doctype html>
<html lang="id">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>T3 bulat ramah, absen tercatat</title>
<link href="https://fonts.googleapis.com/css2?family=Baloo+2:wght@400..800&amp;family=Nunito:wght@400..900&amp;display=swap" rel="stylesheet">
<style>
body{margin:0;background:#FBF6EE;font-family:"Nunito",ui-rounded,ui-sans-serif,system-ui,sans-serif;color:#163A2E}
a{color:#255F4A}a:hover{color:#163A2E}
@keyframes t3-pop{0%{opacity:0;transform:scale(0.5)}60%{opacity:1;transform:scale(1.08)}80%{transform:scale(0.97)}100%{opacity:1;transform:scale(1)}}
@keyframes t3-squish{0%{opacity:0;transform:translateY(40px) scale(0.9,1.1)}60%{opacity:1;transform:translateY(-6px) scale(1.03,0.97)}100%{opacity:1;transform:none}}
@keyframes t3-bounce{0%,100%{transform:translateY(0)}40%{transform:translateY(-8px)}60%{transform:translateY(0)}75%{transform:translateY(-3px)}}
@keyframes t3-blob{0%,100%{border-radius:48% 52% 55% 45% / 50% 45% 55% 50%}50%{border-radius:55% 45% 48% 52% / 45% 55% 50% 50%}}
@keyframes t3-wiggle{0%,100%{transform:rotate(0)}25%{transform:rotate(-6deg)}75%{transform:rotate(6deg)}}
@keyframes t3-burst{0%{opacity:1;transform:translate(0,0) scale(1)}100%{opacity:0;transform:translate(var(--x),var(--y)) scale(0.4)}}
@keyframes t3-draw{from{stroke-dashoffset:30}to{stroke-dashoffset:0}}
@keyframes t3-up{from{opacity:0;transform:translateY(30px)}to{opacity:1;transform:none}}
@media (prefers-reduced-motion: reduce){*,*::before,*::after{animation:none!important;transition:none!important}}
@keyframes t3-b0{0%{opacity:0;transform:translate(0,0) scale(0.4)}20%{opacity:1}100%{opacity:0;transform:translate(85px,35px) scale(1)}}
@keyframes t3-b1{0%{opacity:0;transform:translate(0,0) scale(0.4)}20%{opacity:1}100%{opacity:0;transform:translate(35px,85px) scale(1)}}
@keyframes t3-b2{0%{opacity:0;transform:translate(0,0) scale(0.4)}20%{opacity:1}100%{opacity:0;transform:translate(-35px,85px) scale(1)}}
@keyframes t3-b3{0%{opacity:0;transform:translate(0,0) scale(0.4)}20%{opacity:1}100%{opacity:0;transform:translate(-85px,35px) scale(1)}}
@keyframes t3-b4{0%{opacity:0;transform:translate(0,0) scale(0.4)}20%{opacity:1}100%{opacity:0;transform:translate(-85px,-35px) scale(1)}}
@keyframes t3-b5{0%{opacity:0;transform:translate(0,0) scale(0.4)}20%{opacity:1}100%{opacity:0;transform:translate(-35px,-85px) scale(1)}}
@keyframes t3-b6{0%{opacity:0;transform:translate(0,0) scale(0.4)}20%{opacity:1}100%{opacity:0;transform:translate(35px,-85px) scale(1)}}
@keyframes t3-b7{0%{opacity:0;transform:translate(0,0) scale(0.4)}20%{opacity:1}100%{opacity:0;transform:translate(85px,-35px) scale(1)}}
</style>
<style>body{display:flex;justify-content:center}#dc-root{flex-shrink:0}</style>
</head>
<body>
<div id="dc-root">
<div style="width: 390px; height: 844px; box-sizing: border-box; display: flex; flex-direction: column; overflow: hidden; background: #FBF6EE; color: #163A2E; font-family: 'Nunito', ui-rounded, ui-sans-serif, system-ui, sans-serif">

<section style="margin: 16px 16px 0; background: #255F4A; color: #FBF6EE; border-radius: 36px; padding: 40px 20px 28px; display: flex; flex-direction: column; align-items: center; gap: 10px; text-align: center; animation: t3-squish 0.7s cubic-bezier(.3,1.4,.5,1) both">
<div style="position: relative; width: 120px; height: 120px">
<span aria-hidden="true" style="position: absolute; left: 50%; top: 50%; width: 14px; height: 14px; margin: -7px 0 0 -7px; border-radius: 999px; background: #BC8420; animation: t3-b0 0.8s ease-out 0.55s both"></span><span aria-hidden="true" style="position: absolute; left: 50%; top: 50%; width: 14px; height: 14px; margin: -7px 0 0 -7px; border-radius: 999px; background: #255F4A; animation: t3-b1 0.8s ease-out 0.55s both"></span><span aria-hidden="true" style="position: absolute; left: 50%; top: 50%; width: 14px; height: 14px; margin: -7px 0 0 -7px; border-radius: 999px; background: #F4EBDC; animation: t3-b2 0.8s ease-out 0.55s both"></span><span aria-hidden="true" style="position: absolute; left: 50%; top: 50%; width: 14px; height: 14px; margin: -7px 0 0 -7px; border-radius: 999px; background: #BC8420; animation: t3-b3 0.8s ease-out 0.55s both"></span><span aria-hidden="true" style="position: absolute; left: 50%; top: 50%; width: 14px; height: 14px; margin: -7px 0 0 -7px; border-radius: 999px; background: #255F4A; animation: t3-b4 0.8s ease-out 0.55s both"></span><span aria-hidden="true" style="position: absolute; left: 50%; top: 50%; width: 14px; height: 14px; margin: -7px 0 0 -7px; border-radius: 999px; background: #F4EBDC; animation: t3-b5 0.8s ease-out 0.55s both"></span><span aria-hidden="true" style="position: absolute; left: 50%; top: 50%; width: 14px; height: 14px; margin: -7px 0 0 -7px; border-radius: 999px; background: #BC8420; animation: t3-b6 0.8s ease-out 0.55s both"></span><span aria-hidden="true" style="position: absolute; left: 50%; top: 50%; width: 14px; height: 14px; margin: -7px 0 0 -7px; border-radius: 999px; background: #255F4A; animation: t3-b7 0.8s ease-out 0.55s both"></span>
<span style="position: absolute; inset: 0; border-radius: 999px; background: #FBF6EE; display: flex; align-items: center; justify-content: center; animation: t3-pop 0.6s cubic-bezier(.3,1.4,.5,1) 0.3s both"><svg width="64" height="64" viewBox="0 0 24 24" fill="none" stroke="#255F4A" stroke-width="2.6" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M5 12.5l4.5 4.5L19 7.5" stroke-dasharray="30" style="animation: t3-draw 0.4s ease-out 0.7s both"></path></svg></span>
</div>
<h1 style="margin: 14px 0 0; font-family: 'Baloo 2', sans-serif; font-size: 32px; font-weight: 800; line-height: 1.05; animation: t3-pop 0.5s cubic-bezier(.3,1.4,.5,1) 0.8s both">Sip, absen tercatat!</h1>
<span style="font-family: 'Baloo 2', sans-serif; font-size: 60px; font-weight: 800; line-height: 1; animation: t3-bounce 0.9s ease-out 1.1s both">06.52</span>
<span style="font-size: 16px; font-weight: 700; color: #F4EBDC">Senin, 28 Sep · Gedung Kantor Diponegoro</span>
</section>

<div style="padding: 14px 16px 0; display: flex; flex-direction: column; gap: 8px">
<div style="align-self: flex-start; display: flex; gap: 8px; align-items: flex-end; animation: t3-pop 0.45s cubic-bezier(.3,1.4,.5,1) 1.2s both">
<span aria-hidden="true" style="width: 32px; height: 32px; flex-shrink: 0; border-radius: 999px; background: #163A2E; color: #FBF6EE; display: flex; align-items: center; justify-content: center; font-family: 'Baloo 2', sans-serif; font-size: 13px; font-weight: 800">RH</span>
<div style="background: #FFFFFF; border-radius: 22px 22px 22px 6px; padding: 10px 16px; font-size: 15px; font-weight: 700; line-height: 1.45">Selamat bertugas, Andi. Shift mulai 8 menit lagi.</div>
</div>
<div style="display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 8px">
<div style="background: #FFFFFF; border-radius: 24px; padding: 12px 16px; display: flex; flex-direction: column; gap: 2px; animation: t3-pop 0.45s cubic-bezier(.3,1.4,.5,1) 1.35s both"><span style="font-size: 13px; font-weight: 800; color: #6B6154">Status</span><span style="font-family: 'Baloo 2', sans-serif; font-size: 18px; font-weight: 700; line-height: 1.2">Aman di HP</span><span style="font-size: 13px; font-weight: 700; color: #6B6154">Terkirim saat ada sinyal</span></div>
<div style="background: #FFFFFF; border-radius: 24px; padding: 12px 16px; display: flex; flex-direction: column; gap: 2px; animation: t3-pop 0.45s cubic-bezier(.3,1.4,.5,1) 1.45s both"><span style="font-size: 13px; font-weight: 800; color: #6B6154">Kode absen</span><span style="font-family: 'Baloo 2', sans-serif; font-size: 18px; font-weight: 700; line-height: 1.2">AB-7F3C-91D2</span><span style="font-size: 13px; font-weight: 700; color: #6B6154">Simpan kalau ditanya</span></div>
</div>
</div>

<div style="margin-top: auto; padding: 16px 16px 24px">
<a href="L-T3-Beranda.html" style="height: 60px; border-radius: 999px; background: #163A2E; color: #FBF6EE; text-decoration: none; display: flex; align-items: center; justify-content: center; font-family: 'Baloo 2', sans-serif; font-size: 20px; font-weight: 700; animation: t3-pop 0.45s cubic-bezier(.3,1.4,.5,1) 1.6s both">Kembali ke beranda</a>
</div>
</div>
</div>
<script src="dc-lite.js"></script>
</body>
</html>
