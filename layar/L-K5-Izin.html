<!doctype html>
<html lang="id">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>K5 rak loker, izin dan cuti</title>
<link href="https://fonts.googleapis.com/css2?family=Gantari:wght@500;600;700;800&amp;family=Public+Sans:wght@400;500;600;700&amp;display=swap" rel="stylesheet">
<style>
body{margin:0;background:#163A2E;font-family:"Public Sans",ui-sans-serif,system-ui,sans-serif;color:#163A2E}
a{color:#255F4A}a:hover{color:#163A2E}
@keyframes k5-door{from{transform:translateX(0)}to{transform:translateX(101%)}}
@keyframes k5-rise{from{opacity:0;transform:translateY(16px)}to{opacity:1;transform:none}}
@keyframes k5-pop{0%{transform:scale(0.4)}70%{transform:scale(1.1)}100%{transform:scale(1)}}
@keyframes k5-scan{from{transform:translateY(0)}to{transform:translateY(196px)}}
@keyframes k5-up{from{transform:translateY(100%)}to{transform:none}}
@media (prefers-reduced-motion: reduce){*,*::before,*::after{animation:none!important;transition:none!important}}
</style>
<style>body{display:flex;justify-content:center}#dc-root{flex-shrink:0}</style>
</head>
<body>
<div id="dc-root"></div>
<template id="dc-template">
<div style="width: 390px; height: 800px; box-sizing: border-box; display: flex; flex-direction: column; overflow: hidden; background: #163A2E; color: #FBF6EE; font-family: 'Public Sans', ui-sans-serif, system-ui, sans-serif">

<header style="display: flex; align-items: center; gap: 4px; padding: 12px 16px 16px 8px">
<a href="L-K5-Beranda.html" aria-label="Kembali ke rak" style="width: 44px; height: 44px; display: flex; align-items: center; justify-content: center; color: #FBF6EE"><svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.75" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M15 6l-6 6 6 6"></path></svg></a>
<h1 style="margin: 0; flex-grow: 1; font-family: 'Gantari', 'Public Sans', sans-serif; font-size: 20px; font-weight: 700; line-height: 1.25">Izin dan cuti</h1>
</header>

<div role="radiogroup" aria-label="Jenis izin" style="padding: 0 10px; display: flex; gap: 8px">
<sc-for list="{{ jenis }}" as="j" hint-placeholder-count="3">
<sc-if value="{{ j.on }}" hint-placeholder-val="{{ false }}"><button type="button" role="radio" aria-checked="true" onClick="{{ j.pick }}" style="flex: 1 1 0; min-height: 104px; position: relative; overflow: hidden; border: 0; background: #255F4A; color: #FFFFFF; padding: 12px 12px; display: flex; flex-direction: column; align-items: flex-start; gap: 4px; text-align: left; font-family: inherit"><span aria-hidden="true" style="position: absolute; inset: 0; background: #FFFFFF; transform: translateX(101%); animation: k5-door 0.45s cubic-bezier(.6,0,.2,1) both"></span><span style="display: flex; align-items: center; justify-content: center; width: 24px; height: 24px; border-radius: 999px; background: #FBF6EE; color: #255F4A"><svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.25" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M5 12.5l4.5 4.5L19 7.5"></path></svg></span><span style="margin-top: auto; font-family: 'Gantari', 'Public Sans', sans-serif; font-size: 20px; font-weight: 800">{{ j.label }}</span><span style="font-size: 12px; line-height: 1.3; color: #F4EBDC">{{ j.note }}</span></button></sc-if>
<sc-if value="{{ j.off }}" hint-placeholder-val="{{ true }}"><button type="button" role="radio" aria-checked="false" onClick="{{ j.pick }}" style="flex: 1 1 0; min-height: 104px; border: 0; background: #FFFFFF; color: #163A2E; padding: 12px 12px; display: flex; flex-direction: column; align-items: flex-start; gap: 4px; text-align: left; font-family: inherit"><span aria-hidden="true" style="align-self: flex-end; width: 24px; height: 6px; border-radius: 999px; background: rgba(22,58,46,0.22)"></span><span style="margin-top: auto; font-family: 'Gantari', 'Public Sans', sans-serif; font-size: 20px; font-weight: 800">{{ j.label }}</span><span style="font-size: 12px; line-height: 1.3; color: #6B6154">{{ j.note }}</span></button></sc-if>
</sc-for>
</div>

<div style="padding: 8px 10px 0; display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 8px">
<div style="grid-column: span 2; position: relative; overflow: hidden; background: #FFFFFF; color: #163A2E; padding: 12px 16px; display: flex; align-items: center; gap: 12px">
<span aria-hidden="true" style="position: absolute; inset: 0; z-index: 2; background: #255F4A; display: flex; align-items: center; padding-left: 14px; transform: translateX(101%); animation: k5-door 0.6s cubic-bezier(.6,0,.2,1) 0.30s both"><span style="width: 6px; height: 36px; border-radius: 999px; background: rgba(251,246,238,0.7)"></span></span>
<svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="#255F4A" stroke-width="1.75" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><rect x="4" y="5" width="16" height="15" rx="2"></rect><path d="M4 10h16M9 3v4M15 3v4"></path></svg>
<span style="flex-grow: 1; display: flex; flex-direction: column"><span style="font-size: 13px; font-weight: 700; color: #6B6154">Tanggal</span><span style="font-family: 'Gantari', 'Public Sans', sans-serif; font-size: 18px; font-weight: 700">Selasa, 29 Sep 2026</span></span>
<span style="background: #F4EBDC; padding: 6px 10px; font-size: 14px; font-weight: 700">1 hari</span>
</div>

<label style="grid-column: span 2; position: relative; overflow: hidden; background: #FFFFFF; color: #163A2E; padding: 12px 16px; display: flex; flex-direction: column; gap: 6px">
<span aria-hidden="true" style="position: absolute; inset: 0; z-index: 2; background: #255F4A; display: flex; align-items: center; padding-left: 14px; transform: translateX(101%); animation: k5-door 0.6s cubic-bezier(.6,0,.2,1) 0.38s both"><span style="width: 6px; height: 36px; border-radius: 999px; background: rgba(251,246,238,0.7)"></span></span>
<span style="font-size: 13px; font-weight: 700; color: #6B6154">Keterangan</span>
<textarea rows="2" style="border: 0; border-bottom: 1.5px solid #E7DBC8; padding: 4px 0 8px; background: transparent; font-family: inherit; font-size: 16px; line-height: 1.45; color: #163A2E; resize: none">Demam sejak semalam, sudah periksa ke puskesmas.</textarea>
</label>

<div style="grid-column: span 2; position: relative; overflow: hidden; background: #F4EBDC; color: #163A2E; padding: 12px 16px; display: flex; align-items: center; gap: 12px">
<span aria-hidden="true" style="position: absolute; inset: 0; z-index: 2; background: #255F4A; display: flex; align-items: center; padding-left: 14px; transform: translateX(101%); animation: k5-door 0.6s cubic-bezier(.6,0,.2,1) 0.46s both"><span style="width: 6px; height: 36px; border-radius: 999px; background: rgba(251,246,238,0.7)"></span></span>
<svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.75" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M4 8h3l2-3h6l2 3h3v11H4z"></path><circle cx="12" cy="13" r="3.5"></circle></svg>
<span style="flex-grow: 1; display: flex; flex-direction: column"><span style="font-family: 'Gantari', 'Public Sans', sans-serif; font-size: 17px; font-weight: 700">Foto surat dokter</span><span style="font-size: 13px; color: #6B6154">Dianjurkan untuk izin sakit</span></span>
<button type="button" style="height: 44px; padding: 0 16px; border: 0; background: #163A2E; color: #FBF6EE; font-family: inherit; font-size: 14px; font-weight: 700">Tambah</button>
</div>

<div style="min-height: 112px; box-sizing: border-box; position: relative; overflow: hidden; background: #FFFFFF; color: #163A2E; padding: 12px 14px; display: flex; flex-direction: column">
<span aria-hidden="true" style="position: absolute; inset: 0; z-index: 2; background: #255F4A; display: flex; align-items: center; padding-left: 14px; transform: translateX(101%); animation: k5-door 0.6s cubic-bezier(.6,0,.2,1) 0.54s both"><span style="width: 6px; height: 36px; border-radius: 999px; background: rgba(251,246,238,0.7)"></span></span>
<div style="display: flex; align-items: center"><span style="font-size: 13px; font-weight: 700; color: #6B6154">Sisa cuti</span><span aria-hidden="true" style="margin-left: auto; width: 24px; height: 6px; border-radius: 999px; background: rgba(22,58,46,0.22)"></span></div>
<span style="margin-top: auto; font-family: 'Gantari', 'Public Sans', sans-serif; font-size: 36px; font-weight: 800; line-height: 1">{{ sisa }}</span>
<span style="font-size: 13px; color: #6B6154">{{ sisaNote }}</span>
</div>

<div style="min-height: 112px; box-sizing: border-box; position: relative; overflow: hidden; background: #FFFFFF; color: #163A2E; padding: 12px 14px; display: flex; flex-direction: column; gap: 6px">
<span aria-hidden="true" style="position: absolute; inset: 0; z-index: 2; background: #255F4A; display: flex; align-items: center; padding-left: 14px; transform: translateX(101%); animation: k5-door 0.6s cubic-bezier(.6,0,.2,1) 0.60s both"><span style="width: 6px; height: 36px; border-radius: 999px; background: rgba(251,246,238,0.7)"></span></span>
<div style="display: flex; align-items: center"><span style="font-size: 13px; font-weight: 700; color: #6B6154">Disetujui oleh</span><span aria-hidden="true" style="margin-left: auto; width: 24px; height: 6px; border-radius: 999px; background: rgba(22,58,46,0.22)"></span></div>
<span style="margin-top: auto; font-size: 15px; font-weight: 700; line-height: 1.3">1. Rizky Harahap</span>
<span style="font-size: 15px; font-weight: 700; line-height: 1.3">2. HRD NEP</span>
</div>

<button type="button" style="grid-column: span 2; height: 64px; border: 0; background: #FBF6EE; color: #163A2E; font-family: 'Gantari', 'Public Sans', sans-serif; font-size: 20px; font-weight: 800; display: flex; align-items: center; justify-content: center; gap: 10px; animation: k5-rise 0.4s ease-out 0.7s both">Kirim pengajuan<svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M5 12h14M13 6l6 6-6 6"></path></svg></button>
</div>

<p style="margin: 12px 20px 0; display: flex; align-items: center; justify-content: space-between; font-size: 14px; color: #F4EBDC"><span>Sebelumnya: Izin, Jum 25 Sep</span><span style="display: inline-flex; align-items: center; gap: 4px; font-weight: 700; color: #FBF6EE"><svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.25" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M5 12.5l4.5 4.5L19 7.5"></path></svg>Disetujui</span></p>

<nav aria-label="Menu utama" style="margin-top: auto; height: 68px; flex-shrink: 0; background: #FBF6EE; display: grid; grid-template-columns: repeat(4, minmax(0, 1fr)); animation: k5-up 0.5s cubic-bezier(.2,.8,.2,1) 0.1s both">
<a href="L-K5-Beranda.html" style="display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 4px; text-decoration: none; color: #6B6154; font-size: 13px; font-weight: 600"><svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><rect x="4" y="4" width="7" height="7"></rect><rect x="13" y="4" width="7" height="7"></rect><rect x="4" y="13" width="7" height="7"></rect><rect x="13" y="13" width="7" height="7"></rect></svg>Rak</a>
<a href="L-K5-Slip.html" style="display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 4px; text-decoration: none; color: #6B6154; font-size: 13px; font-weight: 600"><svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.75" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M6 3h12v18l-3-2-3 2-3-2-3 2z"></path><path d="M9 8h6M9 12h6"></path></svg>Slip</a>
<a href="L-K5-Izin.html" aria-current="page" style="display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 4px; text-decoration: none; color: #163A2E; font-size: 13px; font-weight: 800; box-shadow: inset 0 3px 0 #255F4A"><svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.75" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><rect x="4" y="5" width="16" height="15" rx="2"></rect><path d="M4 10h16M9 3v4M15 3v4"></path></svg>Izin</a>
<a href="L-K5-Akun.html" style="display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 4px; text-decoration: none; color: #6B6154; font-size: 13px; font-weight: 600"><svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.75" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><circle cx="12" cy="8" r="4"></circle><path d="M4 20c1.5-4 4.5-6 8-6s6.5 2 8 6"></path></svg>Akun</a>
</nav>
</div>
</template>
<script type="text/plain" id="dc-logic">
class Component extends DCLogic {
renderVals() {
const picked = (this.state && this.state.jenis) || 'sakit';
const opts = [
{ id: 'sakit', label: 'Sakit', note: 'Surat dokter dianjurkan' },
{ id: 'izin', label: 'Izin', note: 'Keperluan pribadi' },
{ id: 'cuti', label: 'Cuti', note: 'Memakai saldo cuti' }
];
return {
jenis: opts.map((o) => ({ label: o.label, note: o.note, on: o.id === picked, off: o.id !== picked, pick: () => this.setState({ jenis: o.id }) })),
sisa: picked === 'cuti' ? '8' : '9',
sisaNote: picked === 'cuti' ? 'setelah cuti ini' : 'hari tersisa'
};
}
}
</script>
<script src="dc-lite.js"></script>
</body>
</html>
