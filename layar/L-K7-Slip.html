const tick = () => {

if (p < 1) this._raf = requestAnimationFrame(tick);
};
this.setState({ n: 0 });
this._raf = requestAnimationFrame(tick);
}
componentWillUnmount() {
if (this._raf) cancelAnimationFrame(this._raf);
