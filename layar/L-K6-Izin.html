<!doctype html>
<html lang="id">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>K6 papan tugas, ajukan izin</title>
<link href="https://fonts.googleapis.com/css2?family=Atkinson+Hyperlegible+Next:wght@400;600;700;800&amp;family=Schibsted+Grotesk:wght@600;700;800&amp;display=swap" rel="stylesheet">
<style>
body{margin:0;background:#EAF3EE;font-family:"Atkinson Hyperlegible Next",ui-sans-serif,system-ui,sans-serif;color:#14332A}
a{color:#2C6A55}a:hover{color:#14332A}
@keyframes k6-flap{0%{transform:perspective(240px) rotateX(-92deg);opacity:0.3}55%{transform:perspective(240px) rotateX(18deg);opacity:1}80%{transform:perspective(240px) rotateX(-6deg)}100%{transform:perspective(240px) rotateX(0)}}
@keyframes k6-fill{from{width:0}}
@keyframes k6-rise{from{opacity:0;transform:translateY(16px)}to{opacity:1;transform:none}}
@keyframes k6-live{0%{box-shadow:0 0 0 0 rgba(234,243,238,0.6)}80%,100%{box-shadow:0 0 0 7px rgba(234,243,238,0)}}
@keyframes k6-scan{from{transform:translateY(0)}to{transform:translateY(176px)}}
@keyframes k6-up{from{transform:translateY(100%)}to{transform:none}}
@media (prefers-reduced-motion: reduce){*,*::before,*::after{animation:none!important;transition:none!important}}
</style>
<style>body{display:flex;justify-content:center}#dc-root{flex-shrink:0}</style>
</head>
<body>
<div id="dc-root"></div>
<template id="dc-template">
<div style="width: 390px; height: 740px; box-sizing: border-box; display: flex; flex-direction: column; overflow: hidden; background: #EAF3EE; color: #14332A; font-family: 'Atkinson Hyperlegible Next', ui-sans-serif, system-ui, sans-serif">

<header style="display: flex; align-items: center; gap: 4px; padding: 12px 18px 12px 8px">
<a href="L-K6-Akun.html" aria-label="Kembali" style="width: 44px; height: 44px; display: flex; align-items: center; justify-content: center; color: #14332A"><svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.75" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M15 6l-6 6 6 6"></path></svg></a>
<h1 style="margin: 0; flex-grow: 1; font-family: 'Schibsted Grotesk', sans-serif; font-size: 24px; font-weight: 700; letter-spacing: -0.02em">Ajukan izin</h1>
</header>

<section aria-label="Papan pengajuan" style="margin: 0 12px; background: #14332A; color: #EAF3EE; border-radius: 8px; padding: 16px; display: flex; flex-direction: column; gap: 12px">
<div style="display: flex; align-items: center; font-size: 13px; font-weight: 600"><span>Pengajuan baru</span><span style="margin-left: auto; color: rgba(234,243,238,0.75)">Sisa cuti {{ sisa }}</span></div>
<div style="display: flex; align-items: center; gap: 10px"><span style="width: 76px; font-size: 15px; font-weight: 700">Jenis</span><span role="img" aria-label="{{ kodeLabel }}" style="display: inline-flex; gap: 3px"><sc-for list="{{ kode }}" as="k" hint-placeholder-count="5"><span aria-hidden="true" style="position: relative; width: 28px; height: 40px; border-radius: 4px; background: rgba(234,243,238,0.10); display: inline-flex; align-items: center; justify-content: center; font-size: 24px; font-weight: 700; animation: k6-flap 0.5s cubic-bezier(.3,1.2,.5,1) both">{{ k.c }}<span style="position: absolute; left: 0; right: 0; top: 50%; height: 1px; background: #14332A"></span></span></sc-for></span></div>
<div style="display: flex; align-items: center; gap: 10px"><span style="width: 76px; font-size: 15px; font-weight: 700">Tanggal</span><span role="img" aria-label="29 September" style="display: inline-flex; gap: 3px; align-items: center"><span aria-hidden="true" style="position: relative; width: 28px; height: 40px; border-radius: 4px; background: rgba(234,243,238,0.10); display: inline-flex; align-items: center; justify-content: center; font-size: 24px; font-weight: 700; font-variant-numeric: tabular-nums; animation: k6-flap 0.55s cubic-bezier(.3,1.2,.5,1) 0.35s both">2<span style="position: absolute; left: 0; right: 0; top: 50%; height: 1px; background: #14332A"></span></span><span aria-hidden="true" style="position: relative; width: 28px; height: 40px; border-radius: 4px; background: rgba(234,243,238,0.10); display: inline-flex; align-items: center; justify-content: center; font-size: 24px; font-weight: 700; font-variant-numeric: tabular-nums; animation: k6-flap 0.55s cubic-bezier(.3,1.2,.5,1) 0.42s both">9<span style="position: absolute; left: 0; right: 0; top: 50%; height: 1px; background: #14332A"></span></span><span aria-hidden="true" style="width: 6px; text-align: center; font-size: 24px; font-weight: 700"></span><span aria-hidden="true" style="position: relative; width: 28px; height: 40px; border-radius: 4px; background: rgba(234,243,238,0.10); display: inline-flex; align-items: center; justify-content: center; font-size: 24px; font-weight: 700; font-variant-numeric: tabular-nums; animation: k6-flap 0.55s cubic-bezier(.3,1.2,.5,1) 0.49s both">S<span style="position: absolute; left: 0; right: 0; top: 50%; height: 1px; background: #14332A"></span></span><span aria-hidden="true" style="position: relative; width: 28px; height: 40px; border-radius: 4px; background: rgba(234,243,238,0.10); display: inline-flex; align-items: center; justify-content: center; font-size: 24px; font-weight: 700; font-variant-numeric: tabular-nums; animation: k6-flap 0.55s cubic-bezier(.3,1.2,.5,1) 0.56s both">E<span style="position: absolute; left: 0; right: 0; top: 50%; height: 1px; background: #14332A"></span></span><span aria-hidden="true" style="position: relative; width: 28px; height: 40px; border-radius: 4px; background: rgba(234,243,238,0.10); display: inline-flex; align-items: center; justify-content: center; font-size: 24px; font-weight: 700; font-variant-numeric: tabular-nums; animation: k6-flap 0.55s cubic-bezier(.3,1.2,.5,1) 0.63s both">P<span style="position: absolute; left: 0; right: 0; top: 50%; height: 1px; background: #14332A"></span></span></span></div>
<div style="display: flex; align-items: center; gap: 10px"><span style="width: 76px; font-size: 15px; font-weight: 700">Lama</span><span role="img" aria-label="1 hari" style="display: inline-flex; gap: 3px; align-items: center"><span aria-hidden="true" style="position: relative; width: 28px; height: 40px; border-radius: 4px; background: rgba(234,243,238,0.10); display: inline-flex; align-items: center; justify-content: center; font-size: 24px; font-weight: 700; font-variant-numeric: tabular-nums; animation: k6-flap 0.55s cubic-bezier(.3,1.2,.5,1) 0.60s both">1<span style="position: absolute; left: 0; right: 0; top: 50%; height: 1px; background: #14332A"></span></span><span aria-hidden="true" style="width: 6px; text-align: center; font-size: 24px; font-weight: 700"></span><span aria-hidden="true" style="position: relative; width: 28px; height: 40px; border-radius: 4px; background: rgba(234,243,238,0.10); display: inline-flex; align-items: center; justify-content: center; font-size: 24px; font-weight: 700; font-variant-numeric: tabular-nums; animation: k6-flap 0.55s cubic-bezier(.3,1.2,.5,1) 0.67s both">H<span style="position: absolute; left: 0; right: 0; top: 50%; height: 1px; background: #14332A"></span></span><span aria-hidden="true" style="position: relative; width: 28px; height: 40px; border-radius: 4px; background: rgba(234,243,238,0.10); display: inline-flex; align-items: center; justify-content: center; font-size: 24px; font-weight: 700; font-variant-numeric: tabular-nums; animation: k6-flap 0.55s cubic-bezier(.3,1.2,.5,1) 0.74s both">A<span style="position: absolute; left: 0; right: 0; top: 50%; height: 1px; background: #14332A"></span></span><span aria-hidden="true" style="position: relative; width: 28px; height: 40px; border-radius: 4px; background: rgba(234,243,238,0.10); display: inline-flex; align-items: center; justify-content: center; font-size: 24px; font-weight: 700; font-variant-numeric: tabular-nums; animation: k6-flap 0.55s cubic-bezier(.3,1.2,.5,1) 0.81s both">R<span style="position: absolute; left: 0; right: 0; top: 50%; height: 1px; background: #14332A"></span></span><span aria-hidden="true" style="position: relative; width: 28px; height: 40px; border-radius: 4px; background: rgba(234,243,238,0.10); display: inline-flex; align-items: center; justify-content: center; font-size: 24px; font-weight: 700; font-variant-numeric: tabular-nums; animation: k6-flap 0.55s cubic-bezier(.3,1.2,.5,1) 0.88s both">I<span style="position: absolute; left: 0; right: 0; top: 50%; height: 1px; background: #14332A"></span></span></span></div>
</section>

<div role="radiogroup" aria-label="Jenis izin" style="margin: 12px 12px 0; display: grid; grid-template-columns: repeat(3, minmax(0, 1fr)); background: #FFFFFF; border-radius: 8px; padding: 4px; gap: 4px; animation: k6-rise 0.4s ease-out 0.5s both">
<sc-for list="{{ jenis }}" as="j" hint-placeholder-count="3">
<sc-if value="{{ j.on }}" hint-placeholder-val="{{ false }}"><button type="button" role="radio" aria-checked="true" onClick="{{ j.pick }}" style="height: 44px; border: 0; border-radius: 4px; background: #14332A; color: #EAF3EE; font-family: inherit; font-size: 15px; font-weight: 800">{{ j.label }}</button></sc-if>
<sc-if value="{{ j.off }}" hint-placeholder-val="{{ true }}"><button type="button" role="radio" aria-checked="false" onClick="{{ j.pick }}" style="height: 44px; border: 0; border-radius: 4px; background: transparent; color: #667069; font-family: inherit; font-size: 15px; font-weight: 700">{{ j.label }}</button></sc-if>
</sc-for>
</div>

<label style="margin: 12px 12px 0; background: #FFFFFF; border-radius: 8px; padding: 12px 14px; display: flex; flex-direction: column; gap: 6px; animation: k6-rise 0.4s ease-out 0.6s both"><span style="font-size: 13px; font-weight: 700; color: #667069">Keterangan</span><textarea rows="2" style="border: 0; padding: 0; font-family: inherit; font-size: 16px; line-height: 1.45; color: #14332A; resize: none; background: transparent">Demam sejak semalam, sudah periksa ke puskesmas.</textarea></label>

<div style="margin: 12px 12px 0; display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 8px; animation: k6-rise 0.4s ease-out 0.7s both">
<button type="button" style="height: 52px; border-radius: 8px; background: #FFFFFF; border: 1px solid #667069; display: flex; align-items: center; justify-content: center; gap: 8px; font-family: inherit; font-size: 15px; font-weight: 700; color: #14332A"><svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.75" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M4 8h3l2-3h6l2 3h3v11H4z"></path><circle cx="12" cy="13" r="3.5"></circle></svg>Surat dokter</button>
<div style="height: 52px; box-sizing: border-box; border-radius: 8px; background: #FFFFFF; padding: 0 12px; display: flex; flex-direction: column; justify-content: center"><span style="font-size: 12px; font-weight: 700; color: #667069">Disetujui oleh</span><span style="font-size: 14px; font-weight: 800">Rizky, lalu HRD</span></div>
</div>

<div style="margin-top: auto; padding: 12px 12px 16px; display: flex; flex-direction: column; gap: 8px">
<button type="button" style="height: 58px; border: 0; border-radius: 8px; background: #2C6A55; color: #FFFFFF; font-family: inherit; font-size: 17px; font-weight: 800; animation: k6-rise 0.4s ease-out 0.8s both">Kirim pengajuan</button>
<span style="display: inline-flex; align-items: center; justify-content: center; gap: 6px; font-size: 14px; color: #667069">Sebelumnya: Izin, Rab 16 Sep, disetujui</span>
</div>

<nav aria-label="Menu utama" style="margin-top: auto; height: 68px; flex-shrink: 0; background: #FFFFFF; display: grid; grid-template-columns: repeat(4, minmax(0, 1fr)); animation: k6-up 0.5s cubic-bezier(.2,.8,.2,1) 0.1s both">
<a href="L-K6-Beranda.html" style="display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 4px; text-decoration: none; color: #667069; font-size: 13px; font-weight: 700"><svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><rect x="3" y="5" width="18" height="14" rx="2"></rect><path d="M3 12h18M9 5v14"></path></svg>Papan</a>
<a href="L-K6-Kunci.html" style="display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 4px; text-decoration: none; color: #667069; font-size: 13px; font-weight: 700"><svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.75" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><rect x="6" y="3" width="12" height="18" rx="2"></rect><path d="M10 7h4"></path></svg>Layar kunci</a>
<a href="L-K6-Slip.html" style="display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 4px; text-decoration: none; color: #667069; font-size: 13px; font-weight: 700"><svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.75" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M6 3h12v18l-3-2-3 2-3-2-3 2z"></path><path d="M9 8h6M9 12h6"></path></svg>Hasil kerja</a>
<a href="L-K6-Akun.html" style="display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 4px; text-decoration: none; color: #667069; font-size: 13px; font-weight: 700"><svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.75" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><circle cx="12" cy="8" r="4"></circle><path d="M4 20c1.5-4 4.5-6 8-6s6.5 2 8 6"></path></svg>Akun</a>
</nav>
</div>
</template>
<script type="text/plain" id="dc-logic">
class Component extends DCLogic {
renderVals() {
const picked = (this.state && this.state.jenis) || 'sakit';
const opts = [
{ id: 'sakit', label: 'Sakit' },
{ id: 'izin', label: 'Izin' },
{ id: 'cuti', label: 'Cuti' }
];
const flap = (s) => s.split('').map((c) => ({ c: c }));
return {
jenis: opts.map((o) => ({ label: o.label, on: o.id === picked, off: o.id !== picked, pick: () => this.setState({ jenis: o.id }) })),
kode: flap(picked === 'sakit' ? 'SAKIT' : picked === 'izin' ? 'IZIN' : 'CUTI'),
kodeLabel: picked,
sisa: picked === 'cuti' ? '8 hari setelah cuti ini' : '9 hari'
};
}
}
</script>
<script src="dc-lite.js"></script>
</body>
</html>
