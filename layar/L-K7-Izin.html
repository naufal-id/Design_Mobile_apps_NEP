<!doctype html>
<html lang="id">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>K7 radar lokasi, ajukan izin</title>
<link href="https://fonts.googleapis.com/css2?family=Mona+Sans:wdth,wght@75..125,400..900&amp;family=Onest:wght@400;500;600;700&amp;display=swap" rel="stylesheet">
<style>
body{margin:0;background:#EAF3EE;font-family:"Onest",ui-sans-serif,system-ui,sans-serif;color:#14332A}
a{color:#2C6A55}a:hover{color:#14332A}
@keyframes k7-sweep{to{transform:rotate(360deg)}}
@keyframes k7-ping{0%{transform:scale(0.6);opacity:0.9}100%{transform:scale(2.8);opacity:0}}
@keyframes k7-rise{from{opacity:0;transform:translateY(18px)}to{opacity:1;transform:none}}
@keyframes k7-pop{0%{opacity:0;transform:scale(0.3)}70%{opacity:1;transform:scale(1.12)}100%{opacity:1;transform:scale(1)}}
@keyframes k7-fade{from{opacity:0}to{opacity:1}}
@keyframes k7-wide{from{opacity:0;font-stretch:75%}to{opacity:1;font-stretch:125%}}
@keyframes k7-up{from{opacity:0;transform:translateY(40px)}to{opacity:1;transform:none}}
@media (prefers-reduced-motion: reduce){*,*::before,*::after{animation:none!important;transition:none!important}}
</style>
<style>body{display:flex;justify-content:center}#dc-root{flex-shrink:0}</style>
</head>
<body>
<div id="dc-root"></div>
<template id="dc-template">
<div style="width: 390px; height: 740px; box-sizing: border-box; display: flex; flex-direction: column; overflow: hidden; background: #EAF3EE; color: #14332A; font-family: 'Onest', ui-sans-serif, system-ui, sans-serif">

<header style="display: flex; align-items: center; gap: 4px; padding: 12px 20px 0 8px">
<a href="L-K7-Akun.html" aria-label="Kembali" style="width: 44px; height: 44px; display: flex; align-items: center; justify-content: center; color: #14332A"><svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.75" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M15 6l-6 6 6 6"></path></svg></a>
</header>

<h1 style="margin: 8px 20px 4px; font-family: 'Mona Sans', sans-serif; font-stretch: 125%; font-size: 34px; font-weight: 850; line-height: 0.95; letter-spacing: -0.025em; animation: k7-wide 0.8s cubic-bezier(.2,.8,.2,1) 0.05s both">{{ judul }}</h1>
<p style="margin: 0 20px 14px; font-size: 15px; color: #667069; animation: k7-fade 0.4s ease-out 0.3s both">Selasa, 29 Sep 2026 · shift pagi di Gedung Kantor Diponegoro</p>

<div role="radiogroup" aria-label="Jenis izin" style="margin: 0 16px; display: grid; grid-template-columns: repeat(3, minmax(0, 1fr)); background: #FFFFFF; border-radius: 999px; padding: 6px; gap: 4px; animation: k7-rise 0.45s ease-out 0.35s both">
<sc-for list="{{ jenis }}" as="j" hint-placeholder-count="3">
<sc-if value="{{ j.on }}" hint-placeholder-val="{{ false }}"><button type="button" role="radio" aria-checked="true" onClick="{{ j.pick }}" style="height: 48px; border: 0; border-radius: 999px; background: #14332A; color: #EAF3EE; font-family: 'Mona Sans', sans-serif; font-stretch: 115%; font-size: 16px; font-weight: 750; animation: k7-pop 0.35s cubic-bezier(.3,1.3,.5,1) both">{{ j.label }}</button></sc-if>
<sc-if value="{{ j.off }}" hint-placeholder-val="{{ true }}"><button type="button" role="radio" aria-checked="false" onClick="{{ j.pick }}" style="height: 48px; border: 0; border-radius: 999px; background: transparent; color: #14332A; font-family: 'Mona Sans', sans-serif; font-stretch: 115%; font-size: 16px; font-weight: 600">{{ j.label }}</button></sc-if>
</sc-for>
</div>

<section style="margin: 12px 16px 0; background: #FFFFFF; border-radius: 28px; padding: 16px 18px; display: flex; flex-direction: column; gap: 14px; animation: k7-rise 0.5s ease-out 0.45s both">
<label style="display: flex; flex-direction: column; gap: 6px"><span style="font-size: 13px; font-weight: 600; color: #667069">Keterangan</span><textarea rows="2" style="border: 0; border-bottom: 1.5px solid #E5EAE7; padding: 0 0 8px; font-family: inherit; font-size: 16px; line-height: 1.45; color: #14332A; resize: none; background: transparent">Demam sejak semalam, sudah periksa ke puskesmas.</textarea></label>
<div style="display: flex; align-items: center; gap: 12px"><span style="width: 44px; height: 44px; flex-shrink: 0; border-radius: 16px; background: #EAF3EE; color: #2C6A55; display: flex; align-items: center; justify-content: center"><svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.75" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M4 8h3l2-3h6l2 3h3v11H4z"></path><circle cx="12" cy="13" r="3.5"></circle></svg></span><span style="flex-grow: 1; display: flex; flex-direction: column"><span style="font-size: 15px; font-weight: 600">Foto surat dokter</span><span style="font-size: 13px; color: #667069">Dianjurkan untuk izin sakit</span></span><button type="button" style="height: 40px; padding: 0 14px; border: 0; border-radius: 999px; background: #EAF3EE; font-family: inherit; font-size: 14px; font-weight: 700; color: #2C6A55">Tambah</button></div>
</section>

<section style="margin: 12px 16px 0; display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 8px; animation: k7-rise 0.5s ease-out 0.55s both">
<div style="background: #14332A; color: #EAF3EE; border-radius: 28px; padding: 14px 16px; display: flex; flex-direction: column; gap: 2px"><span style="font-size: 13px; color: #EAF3EE">Sisa cuti</span><span style="font-family: 'Mona Sans', sans-serif; font-stretch: 125%; font-size: 34px; font-weight: 850; line-height: 1">{{ sisa }} <span style="font-size: 16px">hari</span></span></div>
<div style="background: #FFFFFF; border-radius: 28px; padding: 14px 16px; display: flex; flex-direction: column; gap: 4px"><span style="font-size: 13px; color: #667069">Disetujui oleh</span><span style="font-size: 15px; font-weight: 700; line-height: 1.3">Rizky Harahap, lalu HRD</span></div>
</section>

<div style="padding: 16px 16px 0; display: flex; flex-direction: column; gap: 8px; animation: k7-rise 0.5s ease-out 0.65s both">
<button type="button" style="height: 60px; border: 0; border-radius: 999px; background: #2C6A55; color: #FFFFFF; font-family: 'Mona Sans', sans-serif; font-stretch: 110%; font-size: 18px; font-weight: 750">Kirim pengajuan</button>
<span style="align-self: center; font-size: 14px; color: #667069">Sebelumnya: Izin, Rab 16 Sep, disetujui</span>
</div>

<nav aria-label="Menu utama" style="margin: auto 16px 16px; height: 64px; flex-shrink: 0; background: #FFFFFF; border-radius: 999px; padding: 6px; box-sizing: border-box; display: grid; grid-template-columns: repeat(3, minmax(0, 1fr)); gap: 4px; animation: k7-up 0.5s cubic-bezier(.2,.8,.2,1) 0.15s both">
<a href="L-K7-Beranda.html" style="display: flex; align-items: center; justify-content: center; gap: 6px; border-radius: 999px; color: #14332A; text-decoration: none; font-size: 14px; font-weight: 600"><svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><circle cx="12" cy="12" r="8"></circle><circle cx="12" cy="12" r="3"></circle></svg>Radar</a>
<a href="L-K7-Slip.html" style="display: flex; align-items: center; justify-content: center; gap: 6px; border-radius: 999px; color: #14332A; text-decoration: none; font-size: 14px; font-weight: 600"><svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.75" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M6 3h12v18l-3-2-3 2-3-2-3 2z"></path><path d="M9 8h6M9 12h6"></path></svg>Gaji</a>
<a href="L-K7-Akun.html" style="display: flex; align-items: center; justify-content: center; gap: 6px; border-radius: 999px; color: #14332A; text-decoration: none; font-size: 14px; font-weight: 600"><svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.75" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><circle cx="12" cy="8" r="4"></circle><path d="M4 20c1.5-4 4.5-6 8-6s6.5 2 8 6"></path></svg>Saya</a>
</nav>
</div>
</template>
<script type="text/plain" id="dc-logic">
class Component extends DCLogic {
renderVals() {
const picked = (this.state && this.state.jenis) || 'sakit';
const opts = [
{ id: 'sakit', label: 'Sakit' },
{ id: 'izin', label: 'Izin' },
{ id: 'cuti', label: 'Cuti' }
];
return {
jenis: opts.map((o) => ({ label: o.label, on: o.id === picked, off: o.id !== picked, pick: () => this.setState({ jenis: o.id }) })),
judul: picked === 'cuti' ? 'Cuti 1 hari' : picked === 'izin' ? 'Izin 1 hari' : 'Sakit 1 hari',
sisa: picked === 'cuti' ? '8' : '9'
};
}
}
</script>
<script src="dc-lite.js"></script>
</body>
</html>
