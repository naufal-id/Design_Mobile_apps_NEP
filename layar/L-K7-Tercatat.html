body{margin:0;background:#2C6A55;font-family:"Onest",ui-sans-serif,system-ui,sans-serif;color:#FFFFFF}

@keyframes k7-draw{from{stroke-dashoffset:120}to{stroke-dashoffset:0}}
@keyframes k7-dot{0%{opacity:0;transform:scale(0)}100%{opacity:1;transform:scale(1)}}
@media (prefers-reduced-motion: reduce){*,*::before,*::after{animation:none!important;transition:none!important}}
