<script type="text/plain" id="dc-logic">
class Component extends DCLogic {
componentDidMount() {
const reduce = window.matchMedia && window.matchMedia('(prefers-reduced-motion: reduce)').matches;
if (reduce) return;
const target = 3782543, dur = 1200, t0 = Date.now();
const tick = () => {
const p = Math.min(1, (Date.now() - t0) / dur);
this.setState({ n: Math.round(target * (1 - Math.pow(1 - p, 3))) });
if (p < 1) this._raf = requestAnimationFrame(tick);
};
this.setState({ n: 0 });
this._raf = requestAnimationFrame(tick);
}
componentWillUnmount() {
if (this._raf) cancelAnimationFrame(this._raf);
}
renderVals() {
const n = this.state && typeof this.state.n === 'number' ? this.state.n : 3782543;
return { amount: 'Rp' + n.toLocaleString('id-ID') };
}
}
