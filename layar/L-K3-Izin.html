<!doctype html>
<html lang="id">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>K3 sapaan, minta izin</title>
<link href="https://fonts.googleapis.com/css2?family=Onest:wght@400;500;600;700&amp;display=swap" rel="stylesheet">
<style>
body{margin:0;background:#FFFFFF;font-family:"Onest",ui-sans-serif,system-ui,sans-serif;color:#14332A}
a{color:#2C6A55}a:hover{color:#14332A}
@keyframes k3-bubble{from{opacity:0;transform:scale(0.85) translateY(8px)}to{opacity:1;transform:none}}
@keyframes k3-send{from{opacity:0;transform:translateX(24px) scale(0.9)}to{opacity:1;transform:none}}
@keyframes k3-typing{0%{opacity:0}12%{opacity:1}85%{opacity:1}100%{opacity:0}}
@keyframes k3-dot{0%,80%,100%{transform:translateY(0);opacity:0.4}40%{transform:translateY(-4px);opacity:1}}
@media (prefers-reduced-motion: reduce){*,*::before,*::after{animation:none!important;transition:none!important}}
</style>
<style>body{display:flex;justify-content:center}#dc-root{flex-shrink:0}</style>
</head>
<body>
<div id="dc-root"></div>
<template id="dc-template">
<div style="width: 390px; height: 880px; box-sizing: border-box; display: flex; flex-direction: column; overflow: hidden; background: #FFFFFF; color: #14332A; font-family: 'Onest', ui-sans-serif, system-ui, sans-serif">

<header style="display: flex; align-items: center; gap: 4px; padding: 12px 16px 0 8px">
<a href="L-K3-Akun.html" aria-label="Kembali" style="width: 44px; height: 44px; display: flex; align-items: center; justify-content: center; color: #14332A"><svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.75" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M15 6l-6 6 6 6"></path></svg></a>
<h1 style="margin: 0; flex-grow: 1; font-size: 17px; font-weight: 700">Minta izin</h1>
</header>

<section aria-label="Percakapan izin" style="padding: 12px 20px 0; display: flex; flex-direction: column; gap: 10px">
<div style="position: relative; align-self: flex-start">
<span aria-hidden="true" style="position: absolute; left: 0; top: 0; display: flex; gap: 4px; background: #EAF3EE; border-radius: 6px 20px 20px 20px; padding: 14px 16px; animation: k3-typing 0.7s ease-out 0.1s both"><span style="width: 7px; height: 7px; border-radius: 999px; background: #2C6A55; animation: k3-dot 0.9s ease-in-out infinite"></span><span style="width: 7px; height: 7px; border-radius: 999px; background: #2C6A55; animation: k3-dot 0.9s ease-in-out 0.15s infinite"></span><span style="width: 7px; height: 7px; border-radius: 999px; background: #2C6A55; animation: k3-dot 0.9s ease-in-out 0.3s infinite"></span></span>
<div style="background: #EAF3EE; border-radius: 6px 20px 20px 20px; padding: 12px 14px; font-size: 16px; line-height: 1.45; transform-origin: 0 0; animation: k3-bubble 0.4s ease-out 0.75s both">Kamu mau izin apa, Andi?</div>
</div>

<div role="radiogroup" aria-label="Jenis izin" style="display: flex; gap: 8px; animation: k3-bubble 0.4s ease-out 1s both">
<sc-for list="{{ jenis }}" as="j" hint-placeholder-count="3">
<sc-if value="{{ j.on }}" hint-placeholder-val="{{ false }}"><button type="button" role="radio" aria-checked="true" onClick="{{ j.pick }}" style="height: 44px; padding: 0 18px; border: 0; border-radius: 999px; background: #14332A; color: #FFFFFF; font-family: inherit; font-size: 15px; font-weight: 600">{{ j.label }}</button></sc-if>
<sc-if value="{{ j.off }}" hint-placeholder-val="{{ true }}"><button type="button" role="radio" aria-checked="false" onClick="{{ j.pick }}" style="height: 44px; box-sizing: border-box; padding: 0 18px; border: 1.5px solid #2C6A55; border-radius: 999px; background: #FFFFFF; color: #2C6A55; font-family: inherit; font-size: 15px; font-weight: 600">{{ j.label }}</button></sc-if>
</sc-for>
</div>

<sc-for list="{{ jawab }}" as="a" hint-placeholder-count="1">
<div style="align-self: flex-end; background: #2C6A55; color: #FFFFFF; border-radius: 20px 6px 20px 20px; padding: 10px 16px; font-size: 16px; font-weight: 600; transform-origin: 100% 0; animation: k3-send 0.35s cubic-bezier(.2,.8,.2,1) 1.15s both">{{ a.text }}</div>
</sc-for>

<div style="align-self: flex-start; background: #EAF3EE; border-radius: 6px 20px 20px 20px; padding: 12px 14px; font-size: 16px; line-height: 1.45; transform-origin: 0 0; animation: k3-bubble 0.4s ease-out 1.3s both">Untuk tanggal berapa?</div>
<button type="button" style="align-self: flex-end; height: 44px; padding: 0 16px; border: 0; border-radius: 20px 6px 20px 20px; background: #2C6A55; color: #FFFFFF; display: flex; align-items: center; gap: 8px; font-family: inherit; font-size: 16px; font-weight: 600; transform-origin: 100% 0; animation: k3-send 0.35s ease-out 1.55s both">Selasa, 29 Sep · 1 hari<svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M4 20h4L19 9l-4-4L4 16z"></path></svg></button>

<div style="align-self: flex-start; background: #EAF3EE; border-radius: 6px 20px 20px 20px; padding: 12px 14px; font-size: 16px; line-height: 1.45; transform-origin: 0 0; animation: k3-bubble 0.4s ease-out 1.8s both">Ceritakan singkat alasannya.</div>
<label style="display: flex; flex-direction: column; gap: 6px; animation: k3-bubble 0.4s ease-out 2s both"><span style="position: absolute; width: 1px; height: 1px; overflow: hidden; clip: rect(0 0 0 0)">Alasan</span><textarea rows="2" style="border: 1.5px solid #E5EAE7; border-radius: 20px; padding: 12px 16px; font-family: inherit; font-size: 16px; line-height: 1.45; color: #14332A; resize: none">Demam sejak semalam, sudah periksa ke puskesmas.</textarea></label>

<div style="align-self: flex-start; background: #EAF3EE; border-radius: 6px 20px 20px 20px; padding: 12px 14px; display: flex; flex-direction: column; gap: 8px; transform-origin: 0 0; animation: k3-bubble 0.4s ease-out 2.2s both">
<span style="font-size: 16px; line-height: 1.45">{{ lampiranAsk }}</span>
<button type="button" style="align-self: flex-start; height: 40px; padding: 0 14px; border: 0; border-radius: 999px; background: #FFFFFF; display: flex; align-items: center; gap: 6px; font-family: inherit; font-size: 14px; font-weight: 600; color: #2C6A55"><svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.9" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M4 8h3l2-3h6l2 3h3v11H4z"></path><circle cx="12" cy="13" r="3.5"></circle></svg>Foto surat dokter</button>
</div>

<div style="display: flex; gap: 10px; align-items: flex-start; animation: k3-bubble 0.4s ease-out 2.45s both">
<span style="width: 36px; height: 36px; flex-shrink: 0; border-radius: 999px; background: #EAF3EE; color: #2C6A55; display: flex; align-items: center; justify-content: center; font-size: 13px; font-weight: 700">RH</span>
<div style="flex-grow: 1; background: #EDF1F7; border-radius: 6px 20px 20px 20px; padding: 12px 14px; font-size: 15px; line-height: 1.45">{{ ringkas }}</div>
</div>
</section>

<div style="margin-top: auto; padding: 16px 20px 24px; animation: k3-bubble 0.4s ease-out 2.6s both">
<button type="button" style="width: 100%; height: 60px; border: 0; border-radius: 999px; background: #2C6A55; color: #FFFFFF; font-family: inherit; font-size: 17px; font-weight: 600">Kirim pengajuan</button>
</div>
</div>
</template>
<script type="text/plain" id="dc-logic">
class Component extends DCLogic {
renderVals() {
const picked = (this.state && this.state.jenis) || 'sakit';
const opts = [
{ id: 'sakit', label: 'Sakit', answer: 'Sakit', ask: 'Ada surat dokter? Foto saja, tidak wajib.' },
{ id: 'izin', label: 'Izin', answer: 'Izin keperluan pribadi', ask: 'Kalau ada dokumen pendukung, boleh difoto.' },
{ id: 'cuti', label: 'Cuti', answer: 'Cuti tahunan', ask: 'Cuti tidak perlu lampiran.' }
];
const current = opts.find((o) => o.id === picked) || opts[0];
return {
jenis: opts.map((o) => ({ label: o.label, on: o.id === picked, off: o.id !== picked, pick: () => this.setState({ jenis: o.id }) })),
jawab: [{ text: current.answer, key: current.id }],
lampiranAsk: current.ask,
ringkas: picked === 'cuti' ? 'Aku terima dulu, lalu HRD. Sisa cuti kamu jadi 8 hari.' : 'Aku terima dulu dan siapkan pengganti, lalu HRD mencatatnya.'
};
}
}
</script>
<script src="dc-lite.js"></script>
</body>
</html>
