<!doctype html>
<html lang="id">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>K7 radar lokasi, beranda</title>
<link href="https://fonts.googleapis.com/css2?family=Mona+Sans:wdth,wght@75..125,400..900&amp;family=Onest:wght@400;500;600;700&amp;display=swap" rel="stylesheet">
<style>
body{margin:0;background:#EAF3EE;font-family:"Onest",ui-sans-serif,system-ui,sans-serif;color:#14332A}
a{color:#2C6A55}a:hover{color:#14332A}
@keyframes k7-sweep{to{transform:rotate(360deg)}}
@keyframes k7-ping{0%{transform:scale(0.6);opacity:0.9}100%{transform:scale(2.8);opacity:0}}
@keyframes k7-rise{from{opacity:0;transform:translateY(18px)}to{opacity:1;transform:none}}
@keyframes k7-pop{0%{opacity:0;transform:scale(0.3)}70%{opacity:1;transform:scale(1.12)}100%{opacity:1;transform:scale(1)}}
@keyframes k7-fade{from{opacity:0}to{opacity:1}}
@keyframes k7-wide{from{opacity:0;font-stretch:75%}to{opacity:1;font-stretch:125%}}
@keyframes k7-up{from{opacity:0;transform:translateY(40px)}to{opacity:1;transform:none}}
@media (prefers-reduced-motion: reduce){*,*::before,*::after{animation:none!important;transition:none!important}}
</style>
<style>body{display:flex;justify-content:center}#dc-root{flex-shrink:0}</style>
</head>

<circle cx="213.9" cy="120.7" r="9" fill="#FFFFFF" stroke="#4A6FA5" stroke-width="4" style="transform-origin: 213.9px 120.7px; animation: k7-pop 0.5s cubic-bezier(.3,1.4,.5,1) 1.2s both"></circle>
<path d="M179 150 L213.9 120.7" stroke="#EAF3EE" stroke-width="1.5" stroke-dasharray="3 4"></path>
</svg>
<span style="position: absolute; left: 232px; top: 134px; font-size: 13px; font-weight: 700; color: #14332A; background: #FFFFFF; border-radius: 999px; padding: 4px 10px; animation: k7-pop 0.4s ease-out 1.35s both">Kamu · 38 m</span>
<span style="position: absolute; left: 16px; top: 16px; font-size: 13px; font-weight: 600; color: #EAF3EE; background: rgba(234,243,238,0.12); border-radius: 999px; padding: 4px 10px; animation: k7-fade 0.4s ease-out 0.7s both">Radius site 100 m</span>
<span style="position: absolute; right: 16px; bottom: 16px; font-size: 13px; font-weight: 600; color: #EAF3EE; background: rgba(234,243,238,0.12); border-radius: 999px; padding: 4px 10px; animation: k7-fade 0.4s ease-out 0.8s both">Akurasi 12 m</span>
<span style="position: absolute; left: 16px; bottom: 16px; display: inline-flex; align-items: center; gap: 6px; font-size: 13px; font-weight: 600; color: #EAF3EE"><span aria-hidden="true" style="width: 10px; height: 10px; background: #EAF3EE; border-radius: 3px; transform: rotate(45deg)"></span>Titik site</span>
