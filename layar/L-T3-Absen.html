<!doctype html>
<html lang="id">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>T3 bulat ramah, absen masuk</title>
<link href="https://fonts.googleapis.com/css2?family=Baloo+2:wght@400..800&amp;family=Nunito:wght@400..900&amp;display=swap" rel="stylesheet">
<style>
body{margin:0;background:#FBF6EE;font-family:"Nunito",ui-rounded,ui-sans-serif,system-ui,sans-serif;color:#163A2E}
a{color:#255F4A}a:hover{color:#163A2E}
@keyframes t3-pop{0%{opacity:0;transform:scale(0.5)}60%{opacity:1;transform:scale(1.08)}80%{transform:scale(0.97)}100%{opacity:1;transform:scale(1)}}
@keyframes t3-squish{0%{opacity:0;transform:translateY(40px) scale(0.9,1.1)}60%{opacity:1;transform:translateY(-6px) scale(1.03,0.97)}100%{opacity:1;transform:none}}
@keyframes t3-bounce{0%,100%{transform:translateY(0)}40%{transform:translateY(-8px)}60%{transform:translateY(0)}75%{transform:translateY(-3px)}}
@keyframes t3-blob{0%,100%{border-radius:48% 52% 55% 45% / 50% 45% 55% 50%}50%{border-radius:55% 45% 48% 52% / 45% 55% 50% 50%}}
@keyframes t3-wiggle{0%,100%{transform:rotate(0)}25%{transform:rotate(-6deg)}75%{transform:rotate(6deg)}}
@keyframes t3-burst{0%{opacity:1;transform:translate(0,0) scale(1)}100%{opacity:0;transform:translate(var(--x),var(--y)) scale(0.4)}}
@keyframes t3-draw{from{stroke-dashoffset:30}to{stroke-dashoffset:0}}
@keyframes t3-up{from{opacity:0;transform:translateY(30px)}to{opacity:1;transform:none}}
@media (prefers-reduced-motion: reduce){*,*::before,*::after{animation:none!important;transition:none!important}}
</style>
<style>body{display:flex;justify-content:center}#dc-root{flex-shrink:0}</style>
</head>
<body>
<div id="dc-root">
<div style="width: 390px; height: 844px; box-sizing: border-box; display: flex; flex-direction: column; overflow: hidden; background: #FBF6EE; color: #163A2E; font-family: 'Nunito', ui-rounded, ui-sans-serif, system-ui, sans-serif">

<header style="display: flex; align-items: center; gap: 8px; padding: 10px 16px 0">
<a href="L-T3-Beranda.html" aria-label="Kembali" style="width: 44px; height: 44px; border-radius: 999px; background: #FFFFFF; display: flex; align-items: center; justify-content: center; color: #163A2E"><svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.25" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M15 6l-6 6 6 6"></path></svg></a>
<h1 style="margin: 0; font-family: 'Baloo 2', sans-serif; font-size: 22px; font-weight: 700">Absen masuk</h1>
<span style="margin-left: auto; font-family: 'Baloo 2', sans-serif; font-size: 20px; font-weight: 700; background: #FFFFFF; border-radius: 999px; padding: 4px 14px">06.52</span>
</header>

<section aria-label="Pratinjau kamera depan" style="margin: 16px 16px 0; background: #255F4A; color: #FBF6EE; border-radius: 36px; padding: 26px 20px 22px; display: flex; flex-direction: column; align-items: center; gap: 16px; animation: t3-squish 0.7s cubic-bezier(.3,1.4,.5,1) 0.05s both">
<div style="position: relative; width: 232px; height: 232px; display: flex; align-items: center; justify-content: center">
<span aria-hidden="true" style="position: absolute; inset: 0; background: rgba(251,246,238,0.16); animation: t3-blob 3.2s ease-in-out infinite"></span>
<span style="position: relative; width: 196px; height: 196px; border-radius: 999px; background: #FBF6EE; overflow: hidden; display: flex; align-items: flex-end; justify-content: center">
<svg width="170" height="170" viewBox="0 0 170 200" aria-hidden="true"><circle cx="85" cy="80" r="46" fill="#F4EBDC"></circle><path d="M4 200c6-48 40-72 81-72s75 24 81 72z" fill="#F4EBDC"></path></svg>
</span>
</div>
<span style="font-family: 'Baloo 2', sans-serif; font-size: 22px; font-weight: 700; line-height: 1.1; text-align: center">Senyum sedikit, lalu ambil foto</span>
<div style="display: flex; flex-wrap: wrap; justify-content: center; gap: 8px">
<span style="display: inline-flex; align-items: center; gap: 6px; background: rgba(251,246,238,0.16); border-radius: 999px; padding: 6px 12px; font-size: 14px; font-weight: 800; animation: t3-pop 0.45s cubic-bezier(.3,1.4,.5,1) 0.6s both"><svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.75" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M5 12.5l4.5 4.5L19 7.5"></path></svg>Dalam radius, 38 m</span>
<span style="display: inline-flex; align-items: center; gap: 6px; background: rgba(251,246,238,0.16); border-radius: 999px; padding: 6px 12px; font-size: 14px; font-weight: 800; animation: t3-pop 0.45s cubic-bezier(.3,1.4,.5,1) 0.72s both"><svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.75" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M5 12.5l4.5 4.5L19 7.5"></path></svg>HP terdaftar</span>
</div>
</section>

<div role="status" style="margin: 12px 16px 0; background: #FFFFFF; border-radius: 24px; padding: 12px 16px; display: flex; align-items: center; gap: 12px; animation: t3-pop 0.45s cubic-bezier(.3,1.4,.5,1) 0.85s both">
<span style="width: 36px; height: 36px; flex-shrink: 0; border-radius: 999px; background: #F4EBDC; display: flex; align-items: center; justify-content: center"><svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="#BC8420" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M4 20v-3M9 20v-6M14 20v-9M19 20V5"></path><path d="M3 4l18 16"></path></svg></span>
<span style="font-size: 15px; font-weight: 700; line-height: 1.4">Sinyal lagi hilang. Tenang, absen disimpan di HP dulu.</span>
</div>

<div style="margin-top: auto; padding: 16px 16px 24px; display: flex; flex-direction: column; gap: 6px">
<a href="L-T3-Tercatat.html" style="height: 62px; border-radius: 999px; background: #163A2E; color: #FBF6EE; text-decoration: none; display: flex; align-items: center; justify-content: center; gap: 10px; font-family: 'Baloo 2', sans-serif; font-size: 21px; font-weight: 700; animation: t3-pop 0.5s cubic-bezier(.3,1.4,.5,1) 1s both"><svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true" style="animation: t3-wiggle 0.6s ease-in-out 1.8s 2"><path d="M4 8h3l2-3h6l2 3h3v11H4z"></path><circle cx="12" cy="13" r="3.5"></circle></svg>Ambil foto</a>
<a href="#" style="align-self: center; min-height: 40px; display: flex; align-items: center; font-size: 15px; font-weight: 800">Pakai PIN saja</a>
</div>
</div>
</div>
<script src="dc-lite.js"></script>
</body>
</html>
