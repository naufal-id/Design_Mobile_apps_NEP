<!doctype html>
<html lang="id">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>K2 kartu pekerja, ajukan izin</title>
<link href="https://fonts.googleapis.com/css2?family=Gantari:wght@500;600;700&amp;family=Public+Sans:wght@400;500;600;700&amp;display=swap" rel="stylesheet">
<style>
body{margin:0;background:#FBF6EE;font-family:"Public Sans",ui-sans-serif,system-ui,sans-serif;color:#163A2E}
a{color:#255F4A}a:hover{color:#163A2E}
@keyframes k2-flip{from{opacity:0;transform:perspective(900px) rotateX(70deg) translateY(-20px)}to{opacity:1;transform:perspective(900px) rotateX(0)}}
@keyframes k2-rise{from{opacity:0;transform:translateY(20px)}to{opacity:1;transform:none}}
@keyframes k2-pick{0%{transform:perspective(600px) rotateY(-90deg)}100%{transform:perspective(600px) rotateY(0)}}
@keyframes k2-up{from{opacity:0;transform:translateY(40px)}to{opacity:1;transform:none}}
@keyframes k2-line{from{transform:scaleX(0)}to{transform:scaleX(1)}}
@media (prefers-reduced-motion: reduce){*,*::before,*::after{animation:none!important;transition:none!important}}
</style>
<style>body{display:flex;justify-content:center}#dc-root{flex-shrink:0}</style>
</head>
<body>
<div id="dc-root"></div>
<template id="dc-template">
<div style="width: 390px; height: 920px; box-sizing: border-box; display: flex; flex-direction: column; overflow: hidden; background: #FBF6EE; color: #163A2E; font-family: 'Public Sans', ui-sans-serif, system-ui, sans-serif">

<header style="display: flex; align-items: center; gap: 4px; padding: 12px 16px 8px 8px">
<a href="L-K2-Beranda.html" aria-label="Kembali" style="width: 44px; height: 44px; display: flex; align-items: center; justify-content: center; color: #163A2E"><svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.75" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M15 6l-6 6 6 6"></path></svg></a>
<h1 style="margin: 0; flex-grow: 1; font-family: 'Gantari', 'Public Sans', sans-serif; font-size: 22px; font-weight: 700">Ajukan izin</h1>
</header>

<section style="margin: 0 16px; background: #163A2E; color: #FBF6EE; border-radius: 24px; padding: 16px 20px; display: flex; align-items: center; gap: 14px; animation: k2-flip 0.7s cubic-bezier(.2,.8,.2,1) 0.1s both">
<span style="font-family: 'Gantari', 'Public Sans', sans-serif; font-size: 44px; font-weight: 700; line-height: 1">{{ sisa }}</span>
<span style="display: flex; flex-direction: column; gap: 2px"><span style="font-size: 15px; font-weight: 700">hari cuti tahunan</span><span style="font-size: 13px; line-height: 1.4; color: #F4EBDC">{{ sisaNote }}</span></span>
</section>

<form style="margin: 14px 16px 0; background: #FFFFFF; border: 1px solid #E7DBC8; border-radius: 22px; padding: 18px; display: flex; flex-direction: column; gap: 18px; animation: k2-rise 0.6s ease-out 0.25s both">
<fieldset style="margin: 0; padding: 0; border: 0; display: flex; flex-direction: column">
<legend style="padding: 0; margin-bottom: 8px; font-size: 14px; font-weight: 600; color: #6B6154">Jenis</legend>
<div role="radiogroup" aria-label="Jenis izin" style="display: flex; gap: 8px">
<sc-for list="{{ jenis }}" as="j" hint-placeholder-count="3">
<sc-if value="{{ j.on }}" hint-placeholder-val="{{ false }}"><button type="button" role="radio" aria-checked="true" onClick="{{ j.pick }}" style="flex: 1 1 0; height: 48px; border: 0; border-radius: 16px; background: #163A2E; color: #FBF6EE; font-family: 'Gantari', 'Public Sans', sans-serif; font-size: 16px; font-weight: 700; animation: k2-pick 0.35s ease-out both">{{ j.label }}</button></sc-if>
<sc-if value="{{ j.off }}" hint-placeholder-val="{{ true }}"><button type="button" role="radio" aria-checked="false" onClick="{{ j.pick }}" style="flex: 1 1 0; height: 48px; border: 1px solid #E7DBC8; border-radius: 16px; background: #FBF6EE; color: #163A2E; font-family: 'Gantari', 'Public Sans', sans-serif; font-size: 16px; font-weight: 600">{{ j.label }}</button></sc-if>
</sc-for>
</div>
</fieldset>

<div style="display: flex; flex-direction: column; gap: 8px">
<span style="font-size: 14px; font-weight: 600; color: #6B6154">Tanggal</span>
<div style="display: flex; gap: 8px">
<button type="button" style="flex-grow: 1; height: 52px; border: 1px solid #E7DBC8; border-radius: 16px; background: #FFFFFF; padding: 0 14px; display: flex; align-items: center; gap: 10px; font-family: inherit; font-size: 15px; font-weight: 600; color: #163A2E"><svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="#255F4A" stroke-width="1.75" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><rect x="4" y="5" width="16" height="15" rx="2"></rect><path d="M4 10h16M9 3v4M15 3v4"></path></svg>Selasa, 29 Sep 2026</button>
<span style="height: 52px; box-sizing: border-box; border-radius: 16px; background: #F4EBDC; padding: 0 14px; display: flex; align-items: center; font-size: 15px; font-weight: 700">1 hari</span>
</div>
</div>

<label style="display: flex; flex-direction: column; gap: 8px"><span style="font-size: 14px; font-weight: 600; color: #6B6154">Keterangan</span><textarea rows="3" style="border: 1px solid #E7DBC8; border-radius: 16px; padding: 12px 14px; font-family: inherit; font-size: 15px; line-height: 1.45; color: #163A2E; resize: none">Demam sejak semalam, sudah periksa ke puskesmas.</textarea></label>

<div style="display: flex; align-items: center; gap: 12px; background: #FBF6EE; border: 1px dashed #BC8420; border-radius: 16px; padding: 10px 12px">
<span style="width: 40px; height: 40px; flex-shrink: 0; border-radius: 12px; background: #F4EBDC; color: #163A2E; display: flex; align-items: center; justify-content: center"><svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.75" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M4 8h3l2-3h6l2 3h3v11H4z"></path><circle cx="12" cy="13" r="3.5"></circle></svg></span>
<span style="flex-grow: 1; display: flex; flex-direction: column"><span style="font-size: 15px; font-weight: 600">Foto surat dokter</span><span style="font-size: 13px; color: #6B6154">{{ lampiranNote }}</span></span>
<button type="button" style="height: 40px; padding: 0 14px; border: 0; border-radius: 999px; background: #163A2E; font-family: inherit; font-size: 14px; font-weight: 700; color: #FBF6EE">Tambah</button>
</div>
</form>

<section style="margin: 14px 16px 0; display: flex; flex-direction: column; gap: 10px; animation: k2-rise 0.6s ease-out 0.45s both">
<div style="display: flex; align-items: center; gap: 8px">
<span style="display: inline-flex; align-items: center; gap: 8px; font-size: 14px; font-weight: 600"><span style="width: 34px; height: 34px; border-radius: 12px; background: #163A2E; color: #FBF6EE; display: flex; align-items: center; justify-content: center; font-family: 'Gantari', 'Public Sans', sans-serif; font-size: 13px; font-weight: 700">RH</span>Rizky Harahap</span>
<span aria-hidden="true" style="flex-grow: 1; height: 2px; background: #255F4A; transform-origin: left; animation: k2-line 0.6s ease-out 0.9s both"></span>
<span style="display: inline-flex; align-items: center; gap: 8px; font-size: 14px; font-weight: 600"><span style="width: 34px; height: 34px; border-radius: 12px; background: #F4EBDC; display: flex; align-items: center; justify-content: center; font-family: 'Gantari', 'Public Sans', sans-serif; font-size: 13px; font-weight: 700">HR</span>HRD</span>
</div>
<p style="margin: 0; font-size: 14px; line-height: 1.45; color: #6B6154">Koordinator menyiapkan pengganti untuk shift kamu, lalu HRD mencatatnya.</p>
<button type="button" style="height: 56px; border: 0; border-radius: 16px; background: #255F4A; color: #FFFFFF; font-family: inherit; font-size: 17px; font-weight: 700">Kirim pengajuan</button>
<div style="display: flex; align-items: center; justify-content: space-between; font-size: 14px"><span style="color: #6B6154">Sebelumnya: Izin, Jum 25 Sep</span><span style="display: inline-flex; align-items: center; gap: 4px; font-weight: 700; color: #255F4A"><svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M5 12.5l4.5 4.5L19 7.5"></path></svg>Disetujui</span></div>
</section>

<nav aria-label="Menu utama" style="margin: auto 16px 16px; height: 64px; flex-shrink: 0; background: #FFFFFF; border: 1px solid #E7DBC8; border-radius: 22px; box-shadow: 0 6px 18px rgba(22,58,46,0.08); padding: 6px; box-sizing: border-box; display: grid; grid-template-columns: repeat(4, minmax(0, 1fr)); gap: 4px; animation: k2-up 0.6s cubic-bezier(.2,.8,.2,1) 0.2s both">
<a href="L-K2-Beranda.html" aria-label="Beranda" style="display: flex; align-items: center; justify-content: center; border-radius: 16px; color: #6B6154; text-decoration: none"><svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.75" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M4 11l8-7 8 7"></path><path d="M6 10v10h12V10"></path></svg></a>
<a href="L-K2-Slip.html" aria-label="Slip gaji" style="display: flex; align-items: center; justify-content: center; border-radius: 16px; color: #6B6154; text-decoration: none"><svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.75" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M6 3h12v18l-3-2-3 2-3-2-3 2z"></path><path d="M9 8h6M9 12h6"></path></svg></a>
<a href="L-K2-Izin.html" aria-current="page" style="display: flex; align-items: center; justify-content: center; gap: 6px; border-radius: 16px; background: #163A2E; color: #FBF6EE; text-decoration: none; font-size: 13px; font-weight: 700"><svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.75" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><rect x="4" y="5" width="16" height="15" rx="2"></rect><path d="M4 10h16M9 3v4M15 3v4"></path></svg>Izin</a>
<a href="L-K2-Akun.html" aria-label="Akun" style="display: flex; align-items: center; justify-content: center; border-radius: 16px; color: #6B6154; text-decoration: none"><svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.75" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><circle cx="12" cy="8" r="4"></circle><path d="M4 20c1.5-4 4.5-6 8-6s6.5 2 8 6"></path></svg></a>
</nav>
</div>
</template>
<script type="text/plain" id="dc-logic">
class Component extends DCLogic {
renderVals() {
const picked = (this.state && this.state.jenis) || 'sakit';
const opts = [
{ id: 'sakit', label: 'Sakit', note: 'Dianjurkan untuk izin sakit' },
{ id: 'izin', label: 'Izin', note: 'Tidak wajib' },
{ id: 'cuti', label: 'Cuti', note: 'Tidak perlu untuk cuti' }
];
const current = opts.find((o) => o.id === picked) || opts[0];
return {
jenis: opts.map((o) => ({ label: o.label, on: o.id === picked, off: o.id !== picked, pick: () => this.setState({ jenis: o.id }) })),
sisa: picked === 'cuti' ? '8' : '9',
sisaNote: picked === 'cuti' ? 'Setelah pengajuan ini, dari 9 hari' : 'Ikut kamu walau pindah penempatan',
lampiranNote: current.note
};
}
}
</script>
<script src="dc-lite.js"></script>
</body>
</html>
